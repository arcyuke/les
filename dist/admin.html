<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Админка — ЛЕС</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/admin.css"><script type="module" src="assets/admin.mjs"></script></head><body class="admin-body"><main class="admin-shell"><header class="admin-top"><h1>Управление Лесом</h1><a href="index.html" class="text-link">Открыть сайт ↗</a><button type="button" class="admin-disconnect" id="logout" hidden>Выйти</button></header><section class="admin-panel" id="login-panel"><h2>Войти через GitHub</h2><p>Токен нужен для чтения и изменения репозитория arcyuke/les. Он остаётся в памяти этой вкладки и не сохраняется на сайте.</p><form id="login"><label for="token">GitHub-токен</label><input id="token" name="token" type="password" required autocomplete="off" spellcheck="false"><div class="admin-tools"><button type="submit" class="primary">Подключиться</button><button id="demo" type="button">Посмотреть редактор без входа</button></div></form><p>Для токена выберите только репозиторий les и право Contents: Read and write.</p></section><p class="admin-status" id="admin-status" role="status" aria-live="polite"></p><section id="workspace" hidden><div class="admin-tools"><button type="button" id="publish" class="primary">Сохранить в GitHub</button><button type="button" id="preview">Предпросмотр</button><button type="button" id="export">Скачать тексты JSON</button></div><nav class="admin-tabs" id="tabs" aria-label="Разделы управления"></nav><div id="editor"></div><iframe title="Предпросмотр сайта" id="preview-frame" class="admin-preview" sandbox="" hidden></iframe></section></main></body></html>
